[package]
name = "migratex"
version = "1.0.0"
edition = "2024"
authors = ["Nicolas talle <dev@nicolab.net>"]
license = "MIT"
repository = "https://github.com/nicolab/migratex"
categories = ["development-tools", "database", "data-structures", "web-programming", "rust-patterns"]
keywords = ["migration", "migrations", "migrate", "database", "versioning"]
description = "Agnostic migration toolkit library."
documentation = "https://docs.rs/migratex"

[dependencies]
async-trait = "0.1"
chrono = "0.4"
okerr = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Used/compiled only whith json feature
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = {version = "1.0", optional = true}

# Used/compiled only whith sqlx (SQLite) or postgres feature
sqlx = { version = "0.9", features = ["runtime-tokio", "macros"], optional = true}

[dev-dependencies]
thiserror = "2"

[features]
default = []
json = ["serde", "serde_json"]
sqlx = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]

[[example]]
name = "custom"
required-features = ["json"]

[[example]]
name = "json"
required-features = ["json"]

[[example]]
name = "sqlx-sqlite"
required-features = ["sqlx"]

[[example]]
name = "sqlx-postgres"
required-features = ["postgres"]
